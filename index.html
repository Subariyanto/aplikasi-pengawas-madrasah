<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Aplikasi Pengawas Madrasah - KKMA 04 Jember</title>
<style>
:root{--primary:#1B5E20;--primary-light:#2E7D32;--primary-dark:#0D3B13;--accent:#4CAF50;--bg:#f5f5f5;--card:#fff;--text:#212121;--text-light:#757575;--border:#e0e0e0;--danger:#c62828;--warning:#f57f17;--info:#1565c0;--success:#2E7D32}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.sidebar{width:250px;background:var(--primary);color:#fff;height:100vh;position:fixed;left:0;top:0;overflow-y:auto;transition:transform .3s;z-index:1000}
.sidebar.closed{transform:translateX(-250px)}
.sidebar-header{padding:16px;text-align:center;border-bottom:1px solid rgba(255,255,255,.15)}
.sidebar-header h1{font-size:14px;margin-top:4px}
.sidebar-header .emoji{font-size:28px}
.menu-item{display:block;padding:10px 20px;cursor:pointer;transition:background .2s;font-size:13px;border:none;width:100%;text-align:left;color:#fff;background:none;text-decoration:none}
.menu-item:hover,.menu-item.active{background:rgba(255,255,255,.15)}
.menu-item .icon{margin-right:8px}
.menu-section{padding:8px 20px 4px;font-size:10px;text-transform:uppercase;opacity:.5;margin-top:8px}
.main{margin-left:250px;padding:20px;min-height:100vh;transition:margin-left .3s}
.main.full{margin-left:0}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.topbar h1{font-size:18px;color:var(--primary)}
.hamburger{display:none;background:var(--primary);color:#fff;border:none;padding:8px 12px;border-radius:4px;font-size:16px;cursor:pointer}
.card{background:var(--card);border-radius:8px;padding:20px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.card h3{color:var(--primary);margin-bottom:12px;font-size:15px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:20px}
.stat-card{background:var(--card);border-radius:8px;padding:16px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.08);border-left:4px solid var(--primary)}
.stat-card .number{font-size:24px;font-weight:bold;color:var(--primary)}
.stat-card .label{font-size:11px;color:var(--text-light);margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:8px;text-align:left;border-bottom:1px solid var(--border)}
th{background:var(--primary);color:#fff;font-weight:500}
tr:hover{background:#f9f9f9}
.btn{padding:7px 14px;border:none;border-radius:4px;cursor:pointer;font-size:12px;transition:opacity .2s;display:inline-block}
.btn-primary{background:var(--primary);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-warning{background:var(--warning);color:#fff}
.btn-info{background:var(--info);color:#fff}
.btn-sm{padding:4px 8px;font-size:11px}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:12px;font-weight:500;margin-bottom:4px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:8px;border:1px solid var(--border);border-radius:4px;font-size:13px}
.form-group textarea{min-height:60px;resize:vertical}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:500}
.badge-success{background:#e8f5e9;color:#2E7D32}
.badge-warning{background:#fff8e1;color:#f57f17}
.badge-danger{background:#ffebee;color:#c62828}
.badge-info{background:#e3f2fd;color:#1565c0}
.progress-bar{height:8px;background:#e0e0e0;border-radius:4px;overflow:hidden;margin-top:4px}
.progress-fill{height:100%;background:var(--accent);border-radius:4px;transition:width .3s}
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:2000;justify-content:center;align-items:center}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:8px;padding:24px;max-width:700px;width:92%;max-height:85vh;overflow-y:auto}
.modal h3{color:var(--primary);margin-bottom:16px}
.login-page{display:flex;justify-content:center;align-items:center;min-height:100vh;background:linear-gradient(135deg,var(--primary),var(--accent))}
.login-box{background:#fff;padding:40px;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.2);width:90%;max-width:360px;text-align:center}
.login-box h1{color:var(--primary);margin-bottom:4px;font-size:18px}
.login-box h2{color:var(--text-light);font-size:13px;margin-bottom:20px;font-weight:normal}
.login-box input{width:100%;padding:10px;border:1px solid var(--border);border-radius:6px;margin-bottom:10px;font-size:13px}
.login-box button{width:100%;padding:10px;background:var(--primary);color:#fff;border:none;border-radius:6px;font-size:13px;cursor:pointer}
.login-box .error{color:var(--danger);font-size:12px;margin-top:8px}
.tab-bar{display:flex;border-bottom:2px solid var(--border);margin-bottom:16px;overflow-x:auto}
.tab-item{padding:8px 16px;cursor:pointer;font-size:13px;border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tab-item.active{border-bottom-color:var(--primary);color:var(--primary);font-weight:500}
.score-cell{width:50px;text-align:center}
.score-cell input{width:40px;text-align:center;padding:4px;border:1px solid var(--border);border-radius:3px}
.quick-links{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.quick-link{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:16px;text-align:center;cursor:pointer;transition:all .2s}
.quick-link:hover{border-color:var(--primary);transform:translateY(-2px);box-shadow:0 2px 8px rgba(0,0,0,.1)}
.quick-link .ql-icon{font-size:24px;margin-bottom:6px}
.quick-link .ql-label{font-size:11px;color:var(--text-light)}
@media print{.sidebar,.topbar,.hamburger,.btn,.no-print{display:none!important}.main{margin-left:0!important;padding:10px!important}.card{box-shadow:none;border:1px solid #ddd;page-break-inside:avoid}}
@media(max-width:768px){.sidebar{transform:translateX(-250px)}.sidebar.open{transform:translateX(0)}.main{margin-left:0}.hamburger{display:block}.form-row{grid-template-columns:1fr}.stats-grid{grid-template-columns:1fr 1fr}}
</style>

// ===== PREDIKAT HELPERS =====
function getPredikat(persen) {
  if(persen >= 85) return {label:'Amat Baik',cls:'badge-success'};
  if(persen >= 70) return {label:'Baik',cls:'badge-info'};
  if(persen >= 50) return {label:'Cukup',cls:'badge-warning'};
  return {label:'Kurang',cls:'badge-danger'};
}
function autoRTL(nama, persen) {
  if(persen >= 85) return 'Pertahankan dan tingkatkan kualitas ' + nama;
  if(persen >= 70) return 'Lakukan pembinaan berkala pada ' + nama;
  if(persen >= 50) return 'Perlu pembinaan intensif pada ' + nama;
  return 'Perlu pembinaan sangat intensif dan pendampingan pada ' + nama;
}
function autoCatatan(nama, persen) {
  if(persen >= 85) return nama + ' sudah sangat baik, perlu dipertahankan';
  if(persen >= 70) return nama + ' sudah baik, masih ada ruang peningkatan';
  if(persen >= 50) return nama + ' cukup, perlu peningkatan di beberapa aspek';
  return nama + ' masih kurang, perlu perhatian khusus dan pembinaan intensif';
}

function renderMadrasah() {
  const data = getMadrasah();
  let html = '<div class="card no-print"><button class="btn btn-primary" onclick="showAddMadrasah()">+ Tambah Madrasah</button></div>';
  html += '<div class="card"><div style="overflow-x:auto"><table><tr><th>No</th><th>Nama Madrasah</th><th>NSM</th><th>Kecamatan</th><th>Kepala Madrasah</th><th>Akreditasi</th><th>Aksi</th></tr>';
  data.forEach((m, i) => {
    html += '<tr><td>' + (i+1) + '</td><td>' + m.nama + '</td><td>' + m.nsm + '</td><td>' + m.alamat + '</td><td>' + m.kamad + '</td><td><span class="badge badge-' + (m.akreditasi==='A'?'success':m.akreditasi==='B'?'info':'warning') + '">' + m.akreditasi + '</span></td>';
    html += '<td><button class="btn btn-warning btn-sm" onclick="editMadrasah(' + m.id + ')">Edit</button> <button class="btn btn-danger btn-sm" onclick="deleteMadrasah(' + m.id + ')">Hapus</button></td></tr>';

function showAddMadrasah() {
  showModal('Tambah Madrasah', `
    <div class="form-group"><label>Nama Madrasah</label><input id="mNama"></div>
    <div class="form-row">
      <div class="form-group"><label>NSM</label><input id="mNsm"></div>
      <div class="form-group"><label>Kecamatan</label><input id="mAlamat"></div>
    </div>
    <div class="form-group"><label>Kepala Madrasah</label><input id="mKamad"></div>
    <div class="form-row">
      <div class="form-group"><label>Akreditasi</label><select id="mAkreditasi"><option>A</option><option selected>B</option><option>C</option><option>Belum</option></select></div>
      <div class="form-group"><label>Status</label><select id="mStatus"><option selected>Aktif</option><option>Tidak Aktif</option></select></div>
    </div>
    <button class="btn btn-primary" onclick="addMadrasah()">Simpan</button>
  `);
}

function addMadrasah() {
  const data = getMadrasah();
  const newId = data.length > 0 ? Math.max(...data.map(m=>m.id)) + 1 : 1;
  data.push({
    id: newId,
    nama: document.getElementById('mNama').value,
    nsm: document.getElementById('mNsm').value,
    alamat: document.getElementById('mAlamat').value,
    kamad: document.getElementById('mKamad').value,
    akreditasi: document.getElementById('mAkreditasi').value,
    status: document.getElementById('mStatus').value
  });
  saveMadrasah(data);
  closeModal();
  render();
}

function editMadrasah(id) {
  const data = getMadrasah();
  const m = data.find(x => x.id === id);
  if(!m) return;
  showModal('Edit Madrasah', `
    <div class="form-group"><label>Nama Madrasah</label><input id="mNama" value="${m.nama}"></div>
    <div class="form-row">
      <div class="form-group"><label>NSM</label><input id="mNsm" value="${m.nsm}"></div>
      <div class="form-group"><label>Kecamatan</label><input id="mAlamat" value="${m.alamat}"></div>
    </div>
    <div class="form-group"><label>Kepala Madrasah</label><input id="mKamad" value="${m.kamad}"></div>
    <div class="form-row">
      <div class="form-group"><label>Akreditasi</label><select id="mAkreditasi"><option ${m.akreditasi==='A'?'selected':''}>A</option><option ${m.akreditasi==='B'?'selected':''}>B</option><option ${m.akreditasi==='C'?'selected':''}>C</option><option ${m.akreditasi==='Belum'?'selected':''}>Belum</option></select></div>
      <div class="form-group"><label>Status</label><select id="mStatus"><option ${m.status==='Aktif'?'selected':''}>Aktif</option><option ${m.status==='Tidak Aktif'?'selected':''}>Tidak Aktif</option></select></div>
    </div>
    <button class="btn btn-primary" onclick="updateMadrasah(${id})">Simpan</button>
  `);
}

function updateMadrasah(id) {
  const data = getMadrasah();
  const idx = data.findIndex(x => x.id === id);
  if(idx === -1) return;
  data[idx] = {...data[idx],
    nama: document.getElementById('mNama').value,
    nsm: document.getElementById('mNsm').value,
    alamat: document.getElementById('mAlamat').value,
    kamad: document.getElementById('mKamad').value,
    akreditasi: document.getElementById('mAkreditasi').value,
    status: document.getElementById('mStatus').value
  };
  saveMadrasah(data);
  closeModal();
  render();
}

function deleteMadrasah(id) {
  if(!confirm('Hapus madrasah ini?')) return;
  const data = getMadrasah().filter(x => x.id !== id);
  saveMadrasah(data);
  render();
}

// ===== MODAL =====
function showModal(title, content) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay show';
  overlay.id = 'modalOverlay';
  overlay.innerHTML = '<div class="modal"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><h3>' + title + '</h3><button class="btn btn-sm" onclick="closeModal()" style="background:#eee">✕</button></div><div id="modalBody">' + content + '</div></div>';
  overlay.onclick = function(e) { if(e.target === overlay) closeModal(); };
  document.body.appendChild(overlay);
}

function closeModal() {
  const m = document.getElementById('modalOverlay');
  if(m) m.remove();
}

function showFormSupervisiManajerial(editIdx) {
  const madrasah = getMadrasah();
  const isEdit = editIdx !== undefined;
  const existing = isEdit ? getSupervisiManajerial()[editIdx] : null;

  let madrasahOptions = '<option value="">-- Pilih Madrasah --</option>';
  madrasah.forEach(m => {
    const sel = existing && existing.madrasahId === m.id ? 'selected' : '';
    madrasahOptions += '<option value="' + m.id + '" ' + sel + '>' + m.nama + '</option>';
  });

  let formHtml = '<div class="form-row"><div class="form-group"><label>Tanggal</label><input type="date" id="smTanggal" value="' + (existing ? existing.tanggal : today()) + '"></div>';
  formHtml += '<div class="form-group"><label>Madrasah</label><select id="smMadrasah" onchange="autoFillMadrasah(\'sm\')">' + madrasahOptions + '</select></div></div>';
  formHtml += '<div class="form-row"><div class="form-group"><label>NSM</label><input id="smNsm" readonly></div><div class="form-group"><label>Kepala Madrasah</label><input id="smKamad" readonly></div></div>';

  formHtml += '<hr style="margin:16px 0"><h4 style="margin-bottom:12px">Penilaian 8 Standar Nasional Pendidikan</h4>';
  formHtml += '<p style="font-size:11px;color:var(--text-light);margin-bottom:12px">Skor: 1=Kurang, 2=Cukup, 3=Baik, 4=Amat Baik</p>';

  STANDAR_MANAJERIAL.forEach((std, si) => {
    formHtml += '<div style="margin-bottom:12px;padding:10px;background:#f9f9f9;border-radius:6px"><strong style="font-size:13px">' + (si+1) + '. ' + std.nama + '</strong><table style="margin-top:8px"><tr><th style="background:var(--primary-light)">No</th><th style="background:var(--primary-light)">Sub-Indikator</th><th style="background:var(--primary-light)">Skor</th></tr>';
    std.sub.forEach((sub, subi) => {
      const val = existing ? (existing.skor[si] && existing.skor[si][subi]) || 3 : 3;
      formHtml += '<tr><td>' + (subi+1) + '</td><td style="font-size:12px">' + sub + '</td><td class="score-cell"><input type="number" min="1" max="4" value="' + val + '" id="sm_' + si + '_' + subi + '"></td></tr>';
    });
    formHtml += '</table></div>';
  });

  formHtml += '<div style="margin-top:16px"><button class="btn btn-primary" onclick="saveFormSupervisiManajerial(' + (isEdit ? editIdx : -1) + ')">💾 Simpan</button> <button class="btn" style="background:#eee" onclick="closeModal()">Batal</button></div>';

  showModal((isEdit ? 'Edit' : 'Tambah') + ' Supervisi Manajerial', formHtml);

  if(existing) {

function autoFillMadrasah(prefix) {
  const sel = document.getElementById(prefix + 'Madrasah');
  const id = parseInt(sel.value);
  const m = getMadrasah().find(x => x.id === id);
  const nsmEl = document.getElementById(prefix + 'Nsm');
  const kamadEl = document.getElementById(prefix + 'Kamad');
  if(m) {
    if(nsmEl) nsmEl.value = m.nsm;
    if(kamadEl) kamadEl.value = m.kamad;
  } else {
    if(nsmEl) nsmEl.value = '';
    if(kamadEl) kamadEl.value = '';
  }
}

function saveFormSupervisiManajerial(editIdx) {
  const data = getSupervisiManajerial();
  const madrasahId = parseInt(document.getElementById('smMadrasah').value);
  const m = getMadrasah().find(x => x.id === madrasahId);
  if(!m) { alert('Pilih madrasah terlebih dahulu!'); return; }

  const skor = [];
  let totalSkor = 0, totalMax = 0;
  STANDAR_MANAJERIAL.forEach((std, si) => {
    skor[si] = [];
    std.sub.forEach((sub, subi) => {
      const val = parseInt(document.getElementById('sm_' + si + '_' + subi).value) || 3;
      skor[si][subi] = val;
      totalSkor += val;
      totalMax += 4;
    });
  });

  const persen = (totalSkor / totalMax) * 100;
  const pred = getPredikat(persen);

  // Auto-generate catatan & RTL per standar
  const catatan = [];
  const rtl = [];
  STANDAR_MANAJERIAL.forEach((std, si) => {
    const stdTotal = skor[si].reduce((a,b) => a+b, 0);
    const stdMax = skor[si].length * 4;
    const stdPersen = (stdTotal/stdMax)*100;
    catatan.push(autoCatatan(std.nama, stdPersen));
    rtl.push(autoRTL(std.nama, stdPersen));
  });

  const entry = {
    tanggal: document.getElementById('smTanggal').value,
    madrasahId: madrasahId,
    madrasah: m.nama,
    nsm: m.nsm,
    kamad: m.kamad,
    skor: skor,
    totalSkor: totalSkor,
    totalMax: totalMax,
    persen: persen,
    predikat: pred.label,
    catatan: catatan,
    rtl: rtl
  };

  if(editIdx >= 0) {

function switchTabSM(idx, el) {
  for(let i=0;i<3;i++) {
    const tab = document.getElementById('tabSM'+i);
    if(tab) tab.style.display = i===idx ? 'block' : 'none';
  }
  el.parentElement.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
}

function autoFillMadrasahSM() {
  const sel = document.getElementById('smMdr');
  const id = parseInt(sel.value);
  const m = getMadrasah().find(x => x.id === id);
  document.getElementById('smNsmM').value = m ? m.nsm : '';
  document.getElementById('smKamadM').value = m ? m.kamad : '';
}

function saveFormSekolahModel() {
  const madrasahId = parseInt(document.getElementById('smMdr').value);
  const m = getMadrasah().find(x => x.id === madrasahId);
  if(!m) { alert('Pilih madrasah!'); return; }

  const asesmen = [];
  let totalAsesmen = 0;
  INDIKATOR_SEKOLAH_MODEL.forEach((ind, i) => {
    const val = parseInt(document.getElementById('smAsesmen_' + i).value) || 3;
    asesmen.push(val);
    totalAsesmen += val;
  });
  const rataAsesmen = totalAsesmen / INDIKATOR_SEKOLAH_MODEL.length;

  const observasi = [];
  let totalObs = 0;
  CHECKLIST_OBSERVASI_PM.forEach((item, i) => {
    const val = parseInt(document.getElementById('smObs_' + i).value) || 3;
    observasi.push(val);
    totalObs += val;
  });
  const rataObs = totalObs / CHECKLIST_OBSERVASI_PM.length;

  const tet = [];
  LANGKAH_TET.forEach((langkah, i) => {
    tet.push(document.getElementById('smTet_' + i).value);
  });

  const entry = {
    tanggal: document.getElementById('smTgl').value,
    madrasahId: madrasahId,
    madrasah: m.nama,
    nsm: m.nsm,
    kamad: m.kamad,
    asesmen: asesmen,
    rataAsesmen: rataAsesmen,
    observasi: observasi,
    rataObs: rataObs,
    tet: tet
  };

  const data = getSekolahModel();
  data.push(entry);
  saveSekolahModel(data);
  closeModal();
  render();
}

function deleteSekolahModel(idx) {

function renderRekap() {
  const madrasah = getMadrasah();
  const sm = getSupervisiManajerial();
  const pkg = getPKG();
  const pkkm = getPKKM();
  const model = getSekolahModel();

  let html = '<div class="card"><h3>📊 Rekap Per Madrasah</h3>';
  html += '<div style="overflow-x:auto"><table><tr><th>No</th><th>Madrasah</th><th>Sup. Manajerial</th><th>PKG</th><th>PKKM</th><th>Sekolah Model</th></tr>';
  madrasah.forEach((m, i) => {
    const smData = sm.filter(x => x.madrasahId === m.id);
    const pkgData = pkg.filter(x => x.madrasahId === m.id);
    const pkkmData = pkkm.filter(x => x.madrasahId === m.id);
    const modelData = model.filter(x => x.madrasahId === m.id);

    const smBadge = smData.length > 0 ? '<span class="badge badge-success">✓ ' + smData.length + '</span>' : '<span class="badge badge-danger">-</span>';
    const pkgBadge = pkgData.length > 0 ? '<span class="badge badge-success">✓ ' + pkgData.length + '</span>' : '<span class="badge badge-danger">-</span>';
    const pkkmBadge = pkkmData.length > 0 ? '<span class="badge badge-success">✓ ' + pkkmData.length + '</span>' : '<span class="badge badge-danger">-</span>';
    const modelBadge = modelData.length > 0 ? '<span class="badge badge-success">✓ ' + modelData.length + '</span>' : '<span class="badge badge-danger">-</span>';

    html += '<tr><td>' + (i+1) + '</td><td>' + m.nama + '</td><td>' + smBadge + '</td><td>' + pkgBadge + '</td><td>' + pkkmBadge + '</td><td>' + modelBadge + '</td></tr>';
  });
  html += '</table></div></div>';

  // Summary stats
  html += '<div class="stats-grid">';
  html += '<div class="stat-card"><div class="number">' + sm.length + '</div><div class="label">Total Supervisi Manajerial</div></div>';
  html += '<div class="stat-card"><div class="number">' + pkg.length + '</div><div class="label">Total PKG</div></div>';
  html += '<div class="stat-card"><div class="number">' + pkkm.length + '</div><div class="label">Total PKKM</div></div>';
  html += '<div class="stat-card"><div class="number">' + model.length + '</div><div class="label">Total Sekolah Model</div></div>';
  html += '</div>';

  // Rekap per jenis
  html += '<div class="card"><h3>📋 Rekap Per Jenis Supervisi</h3>';
  html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">';
  html += '<button class="btn btn-primary" onclick="showRekapSupervisiManajerial()">Rekap Supervisi Manajerial</button>';
  html += '<button class="btn btn-primary" onclick="showRekapPKG()">Rekap PKG</button>';
  html += '<button class="btn btn-primary" onclick="showRekapPKKM()">Rekap PKKM</button>';
  html += '<button class="btn btn-primary" onclick="showRekapSekolahModel()">Rekap Sekolah Model</button>';
  html += '</div></div>';

  // Cetak laporan semester
  html += '<div class="card no-print"><h3>🖨️ Laporan</h3>';
  html += '<button class="btn btn-info" onclick="cetakLaporanSemester()">Cetak Laporan Semester</button></div>';

  return html;
}

function cetakLaporanSemester() {
  const profil = getProfil();
  const madrasah = getMadrasah();
  const sm = getSupervisiManajerial();
  const pkg = getPKG();
  const pkkm = getPKKM();
  const model = getSekolahModel();

  let html = '<div style="text-align:center;margin-bottom:20px"><h3>LAPORAN SEMESTER PENGAWAS MADRASAH</h3><p>Kementerian Agama Kabupaten Jember</p></div>';
  html += '<table style="width:auto;border:none;margin-bottom:16px"><tr><td style="border:none;padding:2px 8px">Nama</td><td style="border:none;padding:2px 8px">: ' + profil.nama + '</td></tr>';
  html += '<tr><td style="border:none;padding:2px 8px">NIP</td><td style="border:none;padding:2px 8px">: ' + profil.nip + '</td></tr>';
  html += '<tr><td style="border:none;padding:2px 8px">Wilayah Binaan</td><td style="border:none;padding:2px 8px">: ' + profil.wilayah + '</td></tr>';
  html += '<tr><td style="border:none;padding:2px 8px">Jumlah Madrasah</td><td style="border:none;padding:2px 8px">: ' + madrasah.length + '</td></tr></table>';

  html += '<h4>A. Ringkasan Kegiatan</h4>';
  html += '<table><tr><th>No</th><th>Jenis Kegiatan</th><th>Jumlah</th><th>Keterangan</th></tr>';
  html += '<tr><td>1</td><td>Supervisi Manajerial</td><td>' + sm.length + '</td><td>' + (sm.length > 0 ? 'Rata-rata: ' + (sm.reduce((a,b)=>a+b.persen,0)/sm.length).toFixed(1) + '%' : '-') + '</td></tr>';
  html += '<tr><td>2</td><td>Penilaian Kinerja Guru (PKG)</td><td>' + pkg.length + '</td><td>' + (pkg.length > 0 ? 'Rata-rata: ' + (pkg.reduce((a,b)=>a+b.persen,0)/pkg.length).toFixed(1) + '%' : '-') + '</td></tr>';
  html += '<tr><td>3</td><td>Penilaian Kinerja Kepala Madrasah</td><td>' + pkkm.length + '</td><td>' + (pkkm.length > 0 ? 'Rata-rata: ' + (pkkm.reduce((a,b)=>a+b.persen,0)/pkkm.length).toFixed(1) + '%' : '-') + '</td></tr>';
  html += '<tr><td>4</td><td>Pembinaan Sekolah Model</td><td>' + model.length + '</td><td>' + (model.length > 0 ? 'Rata-rata: ' + (model.reduce((a,b)=>a+b.rataAsesmen,0)/model.length).toFixed(2) : '-') + '</td></tr>';
  html += '</table>';

  html += '<h4 style="margin-top:16px">B. Capaian Per Madrasah</h4>';
  html += '<table><tr><th>No</th><th>Madrasah</th><th>SM</th><th>PKG</th><th>PKKM</th><th>Model</th></tr>';
  madrasah.forEach((m, i) => {
    const hasSM = sm.some(x => x.madrasahId === m.id) ? '✓' : '-';
    const hasPKG = pkg.some(x => x.madrasahId === m.id) ? '✓' : '-';
    const hasPKKM = pkkm.some(x => x.madrasahId === m.id) ? '✓' : '-';
    const hasModel = model.some(x => x.madrasahId === m.id) ? '✓' : '-';
    html += '<tr><td>' + (i+1) + '</td><td>' + m.nama + '</td><td>' + hasSM + '</td><td>' + hasPKG + '</td><td>' + hasPKKM + '</td><td>' + hasModel + '</td></tr>';
  });
  html += '</table>';

  html += '<div style="text-align:right;margin-top:40px"><p>Jember, ' + today() + '</p><p>Pengawas Madrasah,</p><br><br><br><p><u>' + profil.nama + '</u></p><p>NIP. ' + profil.nip + '</p></div>';

  showModal('Laporan Semester', html + '<div class="no-print" style="margin-top:16px;text-align:center"><button class="btn btn-primary" onclick="window.print()">🖨️ Cetak</button></div>');
}

// ===== PENGATURAN =====
function renderPengaturan() {
  const profil = getProfil();
  let html = '<div class="card"><h3>👤 Profil Pengawas</h3>';
  html += '<div class="form-group"><label>Nama Lengkap</label><input id="setNama" value="' + profil.nama + '"></div>';
  html += '<div class="form-row"><div class="form-group"><label>NIP</label><input id="setNip" value="' + profil.nip + '"></div>';
  html += '<div class="form-group"><label>Pangkat/Golongan</label><input id="setPangkat" value="' + profil.pangkat + '"></div></div>';
  html += '<div class="form-group"><label>Wilayah Binaan</label><input id="setWilayah" value="' + profil.wilayah + '"></div>';
  html += '<button class="btn btn-primary" onclick="savePengaturanProfil()">💾 Simpan Profil</button></div>';

  html += '<div class="card"><h3>🔑 Ganti Password</h3>';
  html += '<div class="form-row"><div class="form-group"><label>Password Baru</label><input type="password" id="setPass1"></div>';
  html += '<div class="form-group"><label>Konfirmasi Password</label><input type="password" id="setPass2"></div></div>';
  html += '<button class="btn btn-primary" onclick="changePassword()">🔑 Ganti Password</button></div>';

  html += '<div class="card"><h3>⚠️ Reset Data</h3>';
  html += '<p style="font-size:12px;color:var(--text-light);margin-bottom:12px">Hati-hati! Tindakan ini tidak dapat dibatalkan.</p>';
  html += '<button class="btn btn-danger" onclick="resetAllData()">🗑️ Reset Semua Data</button> ';
  html += '<button class="btn btn-warning" onclick="resetMadrasahData()">Reset Data Madrasah ke Default</button></div>';

  return html;
}

function savePengaturanProfil() {
  saveProfil({
    nama: document.getElementById('setNama').value,
    nip: document.getElementById('setNip').value,
    pangkat: document.getElementById('setPangkat').value,
    wilayah: document.getElementById('setWilayah').value
  });
  alert('Profil berhasil disimpan!');
  render();
}

function changePassword() {
  const p1 = document.getElementById('setPass1').value;
  const p2 = document.getElementById('setPass2').value;
  if(!p1) { alert('Masukkan password baru!'); return; }
  if(p1 !== p2) { alert('Password tidak cocok!'); return; }
  setPassword(p1);
  alert('Password berhasil diubah!');
  document.getElementById('setPass1').value = '';
  document.getElementById('setPass2').value = '';
}

function resetAllData() {
  if(!confirm('PERINGATAN: Semua data akan dihapus! Lanjutkan?')) return;
  if(!confirm('Anda yakin? Data tidak dapat dikembalikan!')) return;
  localStorage.clear();
  alert('Semua data berhasil direset.');
  render();
}

function resetMadrasahData() {
  if(!confirm('Reset data madrasah ke default (20 MA)?')) return;
  saveMadrasah(DEFAULT_MADRASAH);
  alert('Data madrasah berhasil direset ke default.');
  render();
}

// ===== INIT =====
render();
</script>\n</body>\n</html>

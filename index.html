<style>
:root{--primary:#1B5E20;--primary-light:#2E7D32;--primary-dark:#0D3B13;--accent:#4CAF50;--bg:#f5f5f5;--card:#fff;--text:#212121;--text-light:#757575;--border:#e0e0e0;--danger:#c62828;--warning:#f57f17;--info:#1565c0;--success:#2E7D32}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.sidebar{width:250px;background:var(--primary);color:#fff;height:100vh;position:fixed;left:0;top:0;overflow-y:auto;transition:transform .3s;z-index:1000}
.sidebar.closed{transform:translateX(-250px)}
.sidebar-header{padding:16px;text-align:center;border-bottom:1px solid rgba(255,255,255,.15)}
.sidebar-header h1{font-size:14px;margin-top:4px}
.menu-item{display:block;padding:10px 20px;cursor:pointer;transition:background .2s;font-size:13px;border:none;width:100%;text-align:left;color:#fff;background:none}
.menu-item:hover,.menu-item.active{background:rgba(255,255,255,.15)}
.menu-item .icon{margin-right:8px}
.menu-section{padding:8px 20px 4px;font-size:10px;text-transform:uppercase;opacity:.5;margin-top:8px}
.main{margin-left:250px;padding:20px;min-height:100vh;transition:margin-left .3s}
.main.full{margin-left:0}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.topbar h1{font-size:18px;color:var(--primary)}
.hamburger{display:none;background:var(--primary);color:#fff;border:none;padding:8px 12px;border-radius:4px;font-size:16px;cursor:pointer}
.card{background:var(--card);border-radius:8px;padding:20px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.card h3{color:var(--primary);margin-bottom:12px;font-size:15px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:20px}
.stat-card{background:var(--card);border-radius:8px;padding:16px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.08);border-left:4px solid var(--primary)}
.stat-card .number{font-size:24px;font-weight:bold;color:var(--primary)}
.stat-card .label{font-size:11px;color:var(--text-light);margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:8px;text-align:left;border-bottom:1px solid var(--border)}
th{background:var(--primary);color:#fff;font-weight:500}
tr:hover{background:#f9f9f9}
.btn{padding:7px 14px;border:none;border-radius:4px;cursor:pointer;font-size:12px;transition:opacity .2s;display:inline-block}
.btn-primary{background:var(--primary);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-warning{background:var(--warning);color:#fff}
.btn-info{background:var(--info);color:#fff}
.btn-sm{padding:4px 8px;font-size:11px}
.btn-penggalian{background:#e8f5e9;color:var(--primary);border:1px solid var(--primary);padding:3px 6px;font-size:10px;border-radius:3px;cursor:pointer}
.btn-penggalian:hover{background:var(--primary);color:#fff}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:12px;font-weight:500;margin-bottom:4px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:8px;border:1px solid var(--border);border-radius:4px;font-size:13px}
.form-group textarea{min-height:60px;resize:vertical}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:500}
.badge-success{background:#e8f5e9;color:#2E7D32}
.badge-warning{background:#fff8e1;color:#f57f17}
.badge-danger{background:#ffebee;color:#c62828}
.badge-info{background:#e3f2fd;color:#1565c0}
.progress-bar{height:8px;background:#e0e0e0;border-radius:4px;overflow:hidden;margin-top:4px}
.progress-fill{height:100%;background:var(--accent);border-radius:4px;transition:width .3s}
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:2000;justify-content:center;align-items:center}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:8px;padding:24px;max-width:700px;width:92%;max-height:85vh;overflow-y:auto}
.modal h3{color:var(--primary);margin-bottom:16px}
#modalPenggalian{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:3000;justify-content:center;align-items:center}
#modalPenggalian .modal-inner{background:#fff;border-radius:8px;padding:24px;max-width:600px;width:92%;max-height:80vh;overflow-y:auto}
#modalPenggalian h3{color:var(--primary);margin-bottom:12px;font-size:14px}
#modalPenggalian ul{margin:8px 0 8px 20px}
#modalPenggalian li{margin-bottom:4px;font-size:12px}
#modalPenggalian b{color:var(--primary-light)}
.login-page{display:flex;justify-content:center;align-items:center;min-height:100vh;background:linear-gradient(135deg,var(--primary),var(--accent))}
.login-box{background:#fff;padding:40px;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.2);width:90%;max-width:360px;text-align:center}
.login-box h1{color:var(--primary);margin-bottom:4px;font-size:18px}
.login-box h2{color:var(--text-light);font-size:13px;margin-bottom:20px;font-weight:normal}
.login-box input{width:100%;padding:10px;border:1px solid var(--border);border-radius:6px;margin-bottom:10px;font-size:13px}
.login-box button{width:100%;padding:10px;background:var(--primary);color:#fff;border:none;border-radius:6px;font-size:13px;cursor:pointer}
.login-box .error{color:var(--danger);font-size:12px;margin-top:8px}
.instrumen-table{width:100%;border-collapse:collapse;margin-bottom:8px;font-size:12px}
.instrumen-table th,.instrumen-table td{border:1px solid #e0e0e0;padding:6px 5px;text-align:center;vertical-align:middle}
.instrumen-table th{background:var(--primary);color:#fff;font-weight:600;font-size:11px}
.instrumen-table .col-no{width:30px}
.instrumen-table .col-aspek{text-align:left;min-width:200px;font-size:11px}
.instrumen-table .col-aspek.clickable{cursor:pointer;color:var(--primary)}
.instrumen-table .col-aspek.clickable:hover{text-decoration:underline}
.instrumen-table .col-skor{width:32px}
.instrumen-table .col-catatan{min-width:120px;text-align:left}
.instrumen-table .col-catatan input{width:100%;padding:4px 6px;border:1px solid #e0e0e0;border-radius:3px;font-size:11px}
.skor-radio{background:none;border:none;cursor:pointer;font-size:1.1rem;color:#94a3b8;transition:all .2s;padding:0 3px;position:relative}.skor-radio:hover{color:var(--primary)}.skor-radio.selected{color:var(--primary);font-weight:bold}.score-group{display:inline-flex;align-items:center;gap:0}
.indikator-row{display:flex;align-items:center;padding:2px 0;border-bottom:none}
.indikator-row:last-child{border-bottom:none}
.indikator-num{width:30px;font-weight:bold;font-size:12px;color:var(--primary)}
.indikator-text{flex:1;font-size:12px;padding-right:8px}
.indikator-actions{display:flex;gap:4px;align-items:center}
.quick-links{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.quick-link{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:16px;text-align:center;cursor:pointer;transition:all .2s}
.quick-link:hover{border-color:var(--primary);transform:translateY(-2px);box-shadow:0 2px 8px rgba(0,0,0,.1)}
.quick-link .ql-icon{font-size:24px;margin-bottom:6px}
.quick-link .ql-label{font-size:11px;color:var(--text-light)}
@media print{.sidebar,.topbar,.hamburger,.btn,.btn-penggalian,.no-print{display:none!important}.main{margin-left:0!important;padding:10px!important}.card{box-shadow:none;border:1px solid #ddd;page-break-inside:avoid}}
@media(max-width:768px){.sidebar{transform:translateX(-250px)}.sidebar.open{transform:translateX(0)}.main{margin-left:0}.hamburger{display:block}.form-row{grid-template-columns:1fr}.stats-grid{grid-template-columns:1fr 1fr}}
</style>
</head>

  if(persen>=50)return{label:'Cukup',cls:'badge-warning'};

}
function autoRTL(nama,persen){
  if(persen>=85)return'Pertahankan dan tingkatkan kualitas '+nama;
  if(persen>=70)return'Lakukan pembinaan berkala pada '+nama;
  if(persen>=50)return'Perlu pembinaan intensif pada '+nama;
  return'Perlu pembinaan sangat intensif dan pendampingan pada '+nama;
}
function autoCatatan(nama,persen){
  if(persen>=85)return nama+' sudah sangat baik, perlu dipertahankan';
  if(persen>=70)return nama+' sudah baik, masih ada ruang peningkatan';
  if(persen>=50)return nama+' cukup, perlu peningkatan di beberapa aspek';
  return nama+' masih kurang, perlu perhatian khusus dan pembinaan intensif';
}

function setSkor(el,val){
  el.parentElement.querySelectorAll('.skor-radio').forEach(b=>{b.classList.remove('selected');b.innerHTML='&#9675;'});
  el.classList.add('selected');el.innerHTML='&#9679;';
}
function getSkor(id){
  const grp=document.querySelector('[data-id="'+id+'"]');
  if(!grp)return 3;
  const btns=grp.querySelectorAll('.skor-radio');
  for(let i=0;i<btns.length;i++){if(btns[i].classList.contains('selected'))return i+1}
  return 3;
}
function setSkorTable(key,idx,val){
  const cells=document.querySelectorAll('[data-skor-id="'+key+'_'+idx+'"]');
  cells.forEach((cell,i)=>{const btn=cell.querySelector('.skor-radio');if(btn){btn.classList.toggle('selected',i===val-1);btn.innerHTML=(i===val-1)?'&#9679;':'&#9675;'}});
  // Auto-fill catatan
  const catEl=document.getElementById(key+'_cat_'+idx);
  if(catEl&&!catEl.dataset.manual){catEl.value=getAutoCatatanByScore(val)}
}
function getAutoCatatanByScore(skor){
  if(skor===4)return'Amat Baik - Pertahankan dan tingkatkan kualitas';
  if(skor===3)return'Baik - Masih ada ruang untuk peningkatan';
  if(skor===2)return'Cukup - Perlu pembinaan di beberapa aspek';
  if(skor===1)return'Kurang - Perlu pembinaan intensif';
  return'';
}
function setCatatanManual(key,idx,val){
  const el=document.getElementById(key+'_cat_'+idx);
  if(el){el.dataset.manual='1'}
}
function getSkorTable(key,idx){
  const cells=document.querySelectorAll('[data-skor-id="'+key+'_'+idx+'"]');
  for(let i=0;i<cells.length;i++){const btn=cells[i].querySelector('.skor-radio.selected');if(btn)return i+1}
  return 3;
}
function getCatatanTable(key,idx){
  const el=document.getElementById(key+'_cat_'+idx);
  return el?el.value:'';
}

function renderSkorCells(key,idx,defaultVal){
  defaultVal=defaultVal||3;
  let h='';
  for(let s=1;s<=4;s++){
    const sel=s===defaultVal?'selected':'';
    const sym=s===defaultVal?'&#9679;':'&#9675;';
    h+='<td class="col-skor" data-skor-id="'+key+'_'+idx+'"><button class="skor-radio '+sel+'" onclick="setSkorTable(\''+key+'\','+idx+','+s+')">'+sym+'</button></td>';
  }
  return h;
}

function saveSupMan(){
  const mid=parseInt(document.getElementById('smMdr').value);const m=getMadrasah().find(x=>x.id===mid);
  if(!m){alert('Pilih madrasah!');return}
  const skor=[],catatanInd=[];let total=0,max=0,gi=0;
  INSTRUMEN_MANAJERIAL.forEach((std,si)=>{skor[si]=[];catatanInd[si]=[];
    std.indikator.forEach((ind,ii)=>{
      const v=getSkorTable('sm',gi);skor[si][ii]=v;total+=v;max+=4;
      catatanInd[si][ii]=getCatatanTable('sm',gi);
      gi++;
    });
  });
  const persen=(total/max)*100;const hasilSup=[],rtl=[];
  INSTRUMEN_MANAJERIAL.forEach((std,si)=>{
    const hEl=document.getElementById('smHasilSup_'+si);
    const rEl=document.getElementById('smRTL_'+si);
    const st=skor[si].reduce((a,b)=>a+b,0),sm2=skor[si].length*4,sp=(st/sm2)*100;
    hasilSup.push(hEl&&hEl.value?hEl.value:'Skor '+st+'/'+sm2+' ('+sp.toFixed(1)+'%) - '+getPredikat(sp).label);
    rtl.push(rEl&&rEl.value?rEl.value:autoRTL(std.nama,sp));
  });
  const entry={tanggal:document.getElementById('smTgl').value,madrasahId:mid,madrasah:m.nama,nsm:m.nsm,kamad:m.kamad,skor,total,max,persen,predikat:getPredikat(persen).label,catatanInd,hasilSup,rtl};
  const data=getSupManajerial();data.push(entry);saveSupManajerial(data);closeModal();render();
}

function delSupMan(i){if(!confirm('Hapus?'))return;const d=getSupManajerial();d.splice(i,1);saveSupManajerial(d);render()}

function cetakSupMan(idx){

function getTingkat(skor){
  if(skor>=3.6)return{label:'Unggul',cls:'badge-success',color:'#2E7D32'};
  if(skor>=3.0)return{label:'Maju',cls:'badge-info',color:'#1565c0'};
  if(skor>=2.0)return{label:'Berkembang',cls:'badge-warning',color:'#f57f17'};
  return{label:'Pra Berkembang',cls:'badge-danger',color:'#c62828'};
}

function saveModel(){
  const mid=parseInt(document.getElementById('mdlMdr').value);const m=getMadrasah().find(x=>x.id===mid);
  if(!m){alert('Pilih madrasah!');return}
  const skor=[],catatanInd=[];let total=0;
  INSTRUMEN_SEKOLAH_MODEL.forEach((item,i)=>{const v=getSkorTable('mdl',i);skor.push(v);total+=v;catatanInd.push(getCatatanTable('mdl',i))});
  const rata=total/INSTRUMEN_SEKOLAH_MODEL.length;
  const hEl=document.getElementById('mdlHasil');const rEl=document.getElementById('mdlRTL');
  const entry={tanggal:document.getElementById('mdlTgl').value,madrasahId:mid,madrasah:m.nama,nsm:m.nsm,kamad:m.kamad,skor,catatanInd,rata,hasilAsesmen:hEl?hEl.value:'',rtl:rEl?rEl.value:''};
  const data=getModelData();data.push(entry);saveModelData(data);closeModal();render();
}

function delModel(i){if(!confirm('Hapus?'))return;const d=getModelData();d.splice(i,1);saveModelData(d);render()}
